name: Build on every platform
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, 2026-10-04
        with:
          toolchain: stable
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Type-check and test the page
        run: |
          npm run check
          npm run test:web
      - name: Build the page
        run: npm run build
      - name: Build the backend
        run: cargo build --locked --bin miniclaw-server
      - name: Swarm ledger tests
        run: cargo test --locked --lib swarm
